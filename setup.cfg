[metadata]
name = micro_sam
version = attr: micro_sam.__version__
description = Segment Anything For Microscopy
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/computational-cell-analytics/micro-sam
author = Anwai Archit, Paul Hilt, Genevieve Buckley, Constantin Pape
license = MIT
license_files = LICENSE
classifiers =
    Development Status :: 5 - Production/Stable
    Framework :: napari
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Topic :: Scientific/Engineering :: Image Processing
project_urls =
    Bug Tracker = https://github.com/computational-cell-analytics/micro-sam/issues
    Documentation = https://computational-cell-analytics.github.io/micro-sam/micro_sam.html
    Source Code = https://github.com/computational-cell-analytics/micro-sam
    User Support = https://github.com/computational-cell-analytics/micro-sam/issues

[options]
packages = find:
python_requires = >=3.11
include_package_data = True
package_dir =
    = .
install_requires =
    anyup @ git+https://github.com/wimmerth/anyup
    bioimage-cpp>=0.7
    # model_export passes FileDescr for covers and documentation, which needs spec >=0.5.11.
    bioimageio.core>=0.11
    click
    h5py
    huggingface-hub
    imagecodecs
    imageio
    joblib
    kornia
    magicgui
    matplotlib
    napari>=0.7
    natsort
    networkx
    numpy
    pandas
    pooch
    PyQt6
    python-elf>=0.9
    scikit-image
    scikit-learn
    segment-anything
    superqt
    tensordict
    timm
    torch>=2.5
    torch-em>=0.10.1
    torchvision
    tqdm
    trackastra>=0.5.3
    transformers>=4.56
    xarray
    xxhash
    z5py>=3
    zarr>=3

[options.packages.find]
where = .

# tell napari where to find to your manifest
[options.entry_points]
napari.manifest =
    micro-sam = micro_sam:napari.yaml
console_scripts =
    micro_sam = micro_sam._cli:cli


# make sure it gets included in your package
[options.package_data]
* = *.yaml
