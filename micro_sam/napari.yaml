name: micro_sam
display_name: Segment Anything for Microscopy
# see https://napari.org/stable/plugins/manifest.html for valid categories
categories: ["Segmentation", "Annotation"]
contributions:
  commands:
    # Commands for sample data.
    # We don't provide the sample data for image series via napari for now,
    # because the image series annotator cannot be called for image layers in napari (yet),
    # but it has to be called with the path to the folder where the images are stored.
    # So providing the sample data in napari would be confusing.
    # - id: micro_sam.sample_data_image_series
    #   python_name: micro_sam.sample_data:sample_data_image_series
    #   title: Load image series sample data from micro_sam plugin
    - id: micro_sam.sample_data_wholeslide
      python_name: micro_sam.sample_data:sample_data_wholeslide
      title: Load WholeSlide sample data from micro_sam plugin
    - id: micro_sam.sample_data_livecell
      python_name: micro_sam.sample_data:sample_data_livecell
      title: Load LiveCell sample data from micro_sam plugin
    - id: micro_sam.sample_data_hela_2d
      python_name: micro_sam.sample_data:sample_data_hela_2d
      title: Load 2D Hela sample data from micro_sam plugin
    - id: micro_sam.sample_data_3d
      python_name: micro_sam.sample_data:sample_data_3d
      title: Load Lucchi++ 3D sample data from micro_sam plugin
    - id: micro_sam.sample_data_tracking
      python_name: micro_sam.sample_data:sample_data_tracking
      title: Load tracking sample data from micro_sam plugin
    - id: micro_sam.sample_data_segmentation
      python_name: micro_sam.sample_data:sample_data_segmentation
      title: Load segmentation sample data from micro_sam plugin

    # Commands for plugins.
    - id: micro_sam.annotator
      python_name: micro_sam.sam_annotator.annotator:Annotator
      title: Start the segmentation annotator
    - id: micro_sam.annotator_tracking
      python_name: micro_sam.sam_annotator.annotator_tracking:AnnotatorTracking
      title: Start the tracking annotator
    - id: micro_sam.batch_annotator
      python_name: micro_sam.sam_annotator.batch_annotator:BatchAnnotator
      title: Start the batch annotator
    - id: micro_sam.object_classifier
      python_name: micro_sam.sam_annotator.object_classifier:ObjectClassifier
      title: Start the SAM based object classifier
    - id: micro_sam.pixel_classifier
      python_name: micro_sam.sam_annotator.pixel_classifier:PixelClassifier
      title: Start the SAM based pixel classifier
    - id: micro_sam.settings
      python_name: micro_sam.sam_annotator._widgets:settings_widget
      title: Set cache directory

  sample_data:
    # - command: micro_sam.sample_data_image_series
    #   display_name: Image series example data
    #   key: micro_sam-image-series
    - command: micro_sam.sample_data_wholeslide
      display_name: WholeSlide example data
      key: micro_sam-wholeslide
    - command: micro_sam.sample_data_livecell
      display_name: LiveCell 2d example data
      key: micro_sam-livecell
    - command: micro_sam.sample_data_hela_2d
      display_name: HeLa 2d example data
      key: micro_sam-hela2d
    - command: micro_sam.sample_data_3d
      display_name: Lucchi++ 3d dataset
      key: micro_sam-lucchi
    - command: micro_sam.sample_data_tracking
      display_name: Tracking sample dataset
      key: micro_sam-tracking
    - command: micro_sam.sample_data_segmentation
      display_name: Segmentation sample dataset
      key: micro_sam-segmentation

  widgets:
    # The display names match the dock titles of the CLI / API entry points, so a tool is called the
    # same way no matter how it was started. They repeat 'sam_annotator/_titles.py', which this static
    # manifest cannot import, so both have to be changed together.
    - command: micro_sam.annotator
      display_name: Segment Anything for Microscopy (Segmentation)
    - command: micro_sam.annotator_tracking
      display_name: Segment Anything for Microscopy (Tracking)
    - command: micro_sam.batch_annotator
      display_name: Segment Anything for Microscopy (Batch Annotation)
    - command: micro_sam.object_classifier
      display_name: Segment Anything for Microscopy (Object Classification)
    - command: micro_sam.pixel_classifier
      display_name: Segment Anything for Microscopy (Pixel Classification)
    - command: micro_sam.settings
      display_name: Segment Anything for Microscopy (Settings)
