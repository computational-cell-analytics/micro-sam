name: Release Drafter

on:
  push:
    # branches to consider in the event; optional, defaults to all
    branches:
      - main
  # # pull_request event is required only for autolabeler
  # pull_request:
  #   # Only following types are handled by the action, but one can default to all as well
  #   types: all # [opened, reopened, synchronize]
  # # pull_request_target event is required for autolabeler to support PRs from forks
  # # pull_request_target:
  # #   types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  update_release_draft:
    outputs:
      new_tag: ${{ steps.tag-version.outputs.new_tag }}
    permissions:
      # write permission is required to create a github release
      contents: write
      # write permission is required for autolabeler
      # otherwise, read permission is required at least
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
  
      - name: Detect new version
        id: check-version
        #if: steps.check-parent-commit.outputs.sha
        uses: salsify/action-detect-and-tag-new-version@v2.0.1
        with:
          create-tag: false
          version-command: |
            grep -Eo '^__version__ = \"(.*)\"$' micro_sam/__version__.py | cut -d\" -f2

      - name: Push tag
        id: tag-version
        if: steps.check-version.outputs.previous-version != steps.check-version.outputs.current-version
        uses: mathieudutour/github-tag-action@v6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: ${{ steps.check-version.outputs.current-version }}

      # Drafts your next Release notes as Pull Requests are merged into "main"
      - name: Publish the release notes
        uses: release-drafter/release-drafter@v6.0.0
        with:
          config-name: release_config.yaml
          publish: "${{ steps.tag-version.outputs.new_tag != '' }}"
          tag: "${{ steps.tag-version.outputs.new_tag }}"
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

  deploy:
    # Publish the package to PyPI when update_release_draft created a new tag/release.
    # Uses PyPI trusted publishing (OIDC) via pypa/gh-action-pypi-publish, so no API
    # tokens or passwords are stored as secrets. A trusted publisher for this repository
    # and workflow must be configured on PyPI beforehand (see the project release docs).
    needs: [update_release_draft]
    runs-on: ubuntu-latest
    if: needs.update_release_draft.outputs.new_tag != ''
    environment: pypi
    permissions:
      id-token: write  # required for OIDC trusted publishing
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Build distributions
      run: |
        python -m pip install --upgrade pip build
        python -m build
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
