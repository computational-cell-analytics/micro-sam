name: test

on:
  push:
    branches:
      - main
      - dev
      - v1.x
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10
  pull_request:  # run CI on commits to any open PR
  workflow_dispatch:  # can manually trigger CI from GitHub actions tab

# Cancel older runs of this workflow on the same PR; other runs get their own group and always run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.os }} ${{ matrix.python-version }} ${{ matrix.torch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]
        torch: [conda]
        # Test: a second macOS job with the PyPI torch wheels, to compare against the conda-forge build.
        include:
          - os: macos-latest
            python-version: "3.12"
            torch: pip

    steps:
      # Spotlight indexes the fresh disk of a macOS runner and competes with the tests for the CPU.
      - name: Disable Spotlight indexing
        if: runner.os == 'macOS'
        run: sudo mdutil -a -i off || true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup micromamba
        uses: mamba-org/setup-micromamba@v1
        # The macOS tests are about 3x slower with threadpoolctl 3.8 (2026-11-11), so pin it to 3.7.
        # Build pip packages on the main disk: the /tmp of ubuntu-latest is too small for the torch wheels.
        env:
          TMPDIR: ${{ runner.temp }}
        with:
          environment-file: "environment.yaml"
          create-args: >-
            python=${{ matrix.python-version }}
            threadpoolctl=3.7
            ${{ runner.os == 'Linux' && 'qt6-wayland' || '' }}

      # Setup Qt libraries for GUI testing on Linux
      - uses: tlambert03/setup-qt-libs@v1

      - name: Install additional dev requirements
        shell: bash -l {0}
        run: python -m pip install -r requirements-dev.txt

      # Test: replace the conda-forge torch and torchvision with the PyPI wheels of the same versions.
      - name: Install torch from PyPI
        if: matrix.torch == 'pip'
        shell: bash -l {0}
        run: |
          TORCH=$(python -c "import torch; print(torch.__version__.split('+')[0])")
          VISION=$(python -c "import torchvision; print(torchvision.__version__.split('+')[0])")
          python -m pip install --force-reinstall --no-deps "torch==$TORCH" "torchvision==$VISION"

      # Test: print the torch build and time a decoder-sized conv, to compare the builds directly.
      - name: Print the torch build and time a conv
        shell: bash -l {0}
        run: |
          python - << 'EOF'
          import time
          import torch
          print(torch.__version__, "mkldnn:", torch.backends.mkldnn.is_available(), "threads:", torch.get_num_threads())
          print(torch.__config__.show())
          conv = torch.nn.Conv2d(64, 64, 3, padding=1)
          x = torch.randn(1, 64, 512, 512)
          with torch.no_grad():
              conv(x)
              t0 = time.perf_counter()
              for _ in range(5):
                  conv(x)
          print(f"conv2d 64x64x3x3 on 512x512: {(time.perf_counter() - t0) / 5:.3f} s per call")
          EOF

      - name: Install micro-sam
        id: install
        shell: bash -l {0}
        run: pip install --no-deps -e .

      # The tests run in two parts: the SAM1 tests (vit_t / vit_t_lm), marked with 'pytest.mark.v1',
      # and everything else, i.e. the SAM2 tests (hvit_t / hvit_t_cells) and the annotator.
      # The v2 part also runs when the v1 part fails, and appends to the v1 coverage.
      - name: Run v1 tests
        uses: aganders3/headless-gui@v2
        with:
          shell: bash -l {0}
          run: pytest -m "v1"

      - name: Run v2 tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: aganders3/headless-gui@v2
        with:
          shell: bash -l {0}
          run: pytest -m "not v1" --cov-append

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          verbose: false
          fail_ci_if_error: false
