name: test

on:
  push:
    branches:
      - main
      - dev
      - v1.x
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10
  pull_request:  # run CI on commits to any open PR
  workflow_dispatch:  # can manually trigger CI from GitHub actions tab

# Cancel older runs of this workflow on the same PR; other runs get their own group and always run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.os }} ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]

    steps:
      # Spotlight indexes the fresh disk of a macOS runner and competes with the tests for the CPU.
      - name: Disable Spotlight indexing
        if: runner.os == 'macOS'
        run: sudo mdutil -a -i off || true

      # Test: sample the load of the macOS runner every minute, to see what competes with the tests.
      - name: Start the resource sampler
        if: runner.os == 'macOS'
        run: |
          nohup bash -c 'while true; do
            echo "=== $(date +%H:%M:%S) $(uptime | sed "s/.*load/load/")"
            sysctl -n vm.swapusage
            ps -Ao pcpu,rss,comm -r | head -6 | sed "s|/.*/||"
            sleep 60
          done' > "$RUNNER_TEMP/sampler.log" 2>&1 &

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup micromamba
        uses: mamba-org/setup-micromamba@v1
        # The macOS tests are about 3x slower with threadpoolctl 3.8 (2026-11-11), so pin it to 3.7.
        # Build pip packages on the main disk: the /tmp of ubuntu-latest is too small for the torch wheels.
        env:
          TMPDIR: ${{ runner.temp }}
        with:
          environment-file: "environment.yaml"
          create-args: >-
            python=${{ matrix.python-version }}
            threadpoolctl=3.7
            ${{ runner.os == 'Linux' && 'qt6-wayland' || '' }}

      # Setup Qt libraries for GUI testing on Linux
      - uses: tlambert03/setup-qt-libs@v1

      - name: Install additional dev requirements
        shell: bash -l {0}
        run: python -m pip install -r requirements-dev.txt

      # Test: time the threadpool limits with threadpoolctl 3.7 and 3.8 on macOS, with torch loaded.
      - name: Time threadpoolctl 3.7 and 3.8
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash -l {0}
        run: |
          python -m pip install --no-deps --target "$RUNNER_TEMP/tpc38" threadpoolctl==3.8.0
          cat > "$RUNNER_TEMP/time_tpc.py" << 'EOF'
          import time
          import numpy, scipy.linalg, sklearn, torch  # noqa: F401
          import threadpoolctl
          from threadpoolctl import threadpool_info, threadpool_limits
          t0 = time.perf_counter()
          info = threadpool_info()
          t_info = time.perf_counter() - t0
          t0 = time.perf_counter()
          for _ in range(20):
              with threadpool_limits(limits=1):
                  pass
          t_limits = (time.perf_counter() - t0) / 20
          print(f"threadpoolctl {threadpoolctl.__version__}: threadpool_info {t_info:.3f} s, threadpool_limits {t_limits:.3f} s per call")
          for lib in info:
              print("  ", lib["internal_api"], lib["num_threads"], lib["filepath"])
          EOF
          python "$RUNNER_TEMP/time_tpc.py"
          PYTHONPATH="$RUNNER_TEMP/tpc38" python "$RUNNER_TEMP/time_tpc.py"

      - name: Install micro-sam
        id: install
        shell: bash -l {0}
        run: pip install --no-deps -e .

      # The tests run in two parts: the SAM1 tests (vit_t / vit_t_lm), marked with 'pytest.mark.v1',
      # and everything else, i.e. the SAM2 tests (hvit_t / hvit_t_cells) and the annotator.
      # The v2 part also runs when the v1 part fails, and appends to the v1 coverage.
      # The macOS runners vary up to 3x in speed, so macOS skips the slow tests. Linux and Windows run them.
      - name: Run v1 tests
        uses: aganders3/headless-gui@v2
        with:
          shell: bash -l {0}
          run: pytest -m "v1${{ runner.os == 'macOS' && ' and not slow' || '' }}"

      - name: Run v2 tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: aganders3/headless-gui@v2
        with:
          shell: bash -l {0}
          run: pytest -m "not v1${{ runner.os == 'macOS' && ' and not slow' || '' }}" --cov-append

      - name: Print the resource sampler log
        if: ${{ always() && runner.os == 'macOS' }}
        run: cat "$RUNNER_TEMP/sampler.log"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          verbose: false
          fail_ci_if_error: false
