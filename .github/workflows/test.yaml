name: test

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10
  pull_request:  # run CI on commits to any open PR
  workflow_dispatch:  # can manually trigger CI from GitHub actions tab

jobs:
  test:
    name: ${{ matrix.os }} ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: "environment.yaml"
          create-args: >-
            python=${{ matrix.python-version }}
            ${{ runner.os == 'Linux' && 'qt6-wayland' || '' }}

      # Setup Qt libraries for GUI testing on Linux
      - uses: tlambert03/setup-qt-libs@v1

      - name: Install additional dev requirements
        shell: bash -l {0}
        run: python -m pip install -r requirements-dev.txt

      - name: Install micro-sam
        id: install
        shell: bash -l {0}
        run: pip install --no-deps -e .

      # The tests run in two parts: the SAM1 tests (vit_t / vit_t_lm), marked with 'pytest.mark.v1',
      # and everything else, i.e. the SAM2 tests (hvit_t / hvit_t_cells) and the annotator.
      # The v2 part also runs when the v1 part fails, and appends to the v1 coverage.
      - name: Run v1 tests
        uses: aganders3/headless-gui@v2
        with:
          shell: bash -l {0}
          run: pytest -m "v1"

      - name: Run v2 tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: aganders3/headless-gui@v2
        with:
          shell: bash -l {0}
          run: pytest -m "not v1" --cov-append

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          verbose: false
          fail_ci_if_error: false
