# Monthly check that fresh installs of the final 1.x release (branch v1.x) still work.
# Scheduled workflows only run from the default branch, so this file lives on main and checks out v1.x.
name: test-v1-scheduled

on:
  schedule:
    - cron: "0 6 1 * *"  # 06:00 UTC on the first day of each month
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-conda:
    name: v1.x conda ${{ matrix.os }} ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v1.x

      - name: Setup micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: "environment.yaml"
          create-args: >-
            python=${{ matrix.python-version }}
            ${{ runner.os == 'Linux' && 'qt6-wayland' || '' }}

      - uses: tlambert03/setup-qt-libs@v1

      - name: Install additional dev requirements
        shell: bash -l {0}
        run: python -m pip install -r requirements-dev.txt

      - name: Install micro-sam
        shell: bash -l {0}
        run: pip install --no-deps -e .

      - name: Run tests
        uses: aganders3/headless-gui@v2
        with:
          shell: bash -l {0}
          run: pytest

  test-pip:
    name: v1.x pip ubuntu-latest ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v1.x

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: tlambert03/setup-qt-libs@v1

      - name: Install dev requirements
        run: python -m pip install -r requirements-dev.txt

      - name: Install micro-sam via pip (with dependencies)
        run: python -m pip install -e .

      - name: Install MobileSAM
        run: python -m pip install git+https://github.com/ChaoningZhang/MobileSAM.git@f706ad9c4eb7f219c00d9050e46328518ffb65d2

      - name: Configure test environment
        run: echo "MICRO_SAM_SKIP_STANDALONE_MASK_PROMPT=1" >> "$GITHUB_ENV"

      - name: Run non-gui tests
        uses: aganders3/headless-gui@v2
        with:
          run: pytest -m "not gui"
