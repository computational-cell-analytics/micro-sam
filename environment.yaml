name: sam2
channels:
    - conda-forge
dependencies:
    - bioimage-cpp >=0.7
    - bioimage-py >=0.2.2
    - bioimageio.core >=0.11
    - click
    - imagecodecs
    - magicgui
    - napari >=0.7.1,<0.11
    - natsort
    - pip
    - pooch
    # pydantic 2.14 breaks the bioimageio.spec wrap serializers that model export uses.
    - pydantic <2.14
    - pyqt6
    - python-xxhash
    - python-elf >=0.9
    # Note: conda / mamba can install a CPU-only pytorch on a computer with an NVIDIA GPU.
    # To make sure that you get a GPU version, add these lines on Linux:
    # - "pytorch=*=cuda*"
    # - "cuda-version=12"
    # and only the first line on Windows. 'cuda-version=12' also supports older GPUs such as the V100.
    # To enforce a CPU installation, change to
    # - "pytorch=*=cpu*"
    - pytorch >=2.5
    # conda-forge's sam-2 registers as 'SAM-2', not 'sam2' as setup.cfg requires.
    # Install micro_sam with 'pip install --no-deps -e .', otherwise pip adds the PyPI sam2 on top.
    - sam-2 >=1.0.0.20241215
    - segment-anything >=1.0.1
    - tensordict
    - torchvision
    - torch_em >=0.10.8
    - tqdm
    - timm
    - transformers >=4.56
    - huggingface_hub
    - trackastra >=0.5.3
    - xarray
    - z5py >=3
    - zarr >=3
    - pip:
        - git+https://github.com/ChaoningZhang/MobileSAM.git
        - git+https://github.com/wimmerth/anyup
